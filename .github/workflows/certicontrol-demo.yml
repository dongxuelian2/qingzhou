name: CertiControl live Qingzhou demonstration
on:
  push:
    branches: [atomgit-bridge]
    paths:
      - '.github/workflows/certicontrol-demo.yml'
      - '.atomgit-bridge/demo.py'
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: bridge
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f2deeed0cd1bdca67dfff4aa70b872a4da799773
          path: source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Qingzhou product and CertiControl plugin
        working-directory: source
        run: mvn -B clean install -DskipTests
      - name: Install browser and fonts
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Initialize and launch real Qingzhou instance
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          cp source/apps/qingzhou-app-certicontrol/target/qingzhou-app-certicontrol-1.0.0-SNAPSHOT.jar source/qingzhou/target/qingzhou/instances/default/apps/qingzhou-app-certicontrol.jar
          cd source/qingzhou/target/qingzhou
          password=$(openssl rand -hex 20)
          echo "::add-mask::$password"
          echo "DEMO_PASSWORD=$password" >> "$GITHUB_ENV"
          printf '%s\n%s\nn\nn\nn\n' "$password" "$password" | sh bin/init.sh
          sh bin/start.sh > "$GITHUB_WORKSPACE/evidence/runtime.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:7900/web/ >/dev/null; then exit 0; fi
            sleep 2
          done
          tail -100 "$GITHUB_WORKSPACE/evidence/runtime.log"
          exit 1
      - name: Verify application in browser and capture screenshots
        run: python bridge/.atomgit-bridge/demo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certicontrol-runtime-evidence
          path: evidence/
          retention-days: 30
